# Served by the runtime stage of the Dockerfile. Replaces nginx's default site.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers. The main Content-Security-Policy is a <meta> tag Astro
    # writes into each page (see astro.config.mjs); frame-ancestors only works
    # as a real header, so it's sent here to stop other sites framing this one.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Astro fingerprints everything under /_astro, so it can be cached forever.
    # A location with its own add_header doesn't inherit the server-level ones,
    # so repeat the header that matters for these script/style files.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
